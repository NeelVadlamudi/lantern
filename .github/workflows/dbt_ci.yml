name: "Lantern: dbt CI"

# Runs on every push and pull request against the committed sample in data/sample/
# (two real service dates). Only dbt, DuckDB and sqlfluff run here; the sample is read in place
# with --vars '{use_sample: true}'. No calls to MBTA, no secrets. The one download is the DuckDB
# httpfs extension that profiles.yml loads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MBTA_DUCKDB_PATH: warehouse/ci.duckdb

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Leak scan (tracked files)
        run: bash scripts/leak_scan.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt and sqlfluff
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: Lint SQL
        run: sqlfluff lint models tests

      # Day 1: full build of the first sample date. The on-run-end hook writes out/board_data.json
      # and out/build_results.json only if every model and test passed.
      - name: dbt build (full refresh, sample day 1)
        run: |
          dbt build --profiles-dir . --full-refresh --vars '{use_sample: true, lamp_end_date: 2026-08-27}'

      # Day 2: incremental build. tests/incremental/ checks a new date was added, older dates were
      # not rebuilt, and fact rows per date equal staging.
      - name: dbt build (incremental, sample day 2)
        run: |
          dbt run-operation save_incremental_state --profiles-dir . --vars '{use_sample: true}'
          dbt build --profiles-dir . --vars '{use_sample: true, lamp_end_date: 2026-08-28, check_incremental: true}'

      - name: Check the build recorded no failures
        run: |
          dbt test --profiles-dir . --select tag:post_build --vars '{use_sample: true, check_build: true}'

      - name: Leak scan (built files)
        run: bash scripts/leak_scan.sh out

      - name: Docs
        run: |
          dbt docs generate --profiles-dir . --static --target-path target_docs --vars '{use_sample: true}'
