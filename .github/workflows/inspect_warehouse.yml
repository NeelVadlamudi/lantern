name: "Lantern: inspect saved warehouse"
# Temporary: restores the saved warehouse (read only, nothing is saved or published) and
# uploads a compressed copy for local debugging.
on:
  push:
    branches: [fix-refresh-real-data]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: warehouse/mbta.duckdb
          key: mbta-duckdb-v3-none
          restore-keys: mbta-duckdb-v3-
      - run: ls -la warehouse && zstd -T0 -10 warehouse/mbta.duckdb -o mbta.duckdb.zst && ls -la mbta.duckdb.zst
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: mbta.duckdb.zst
          retention-days: 1
          compression-level: 0
