# In-repo profile so `dbt build --profiles-dir .` works from the repo root with no setup.
# DuckDB is a local file; no account, server or key is needed.
mbta_reliability:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MBTA_DUCKDB_PATH', 'warehouse/mbta.duckdb') }}"
      schema: main
      threads: 4
