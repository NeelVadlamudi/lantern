name: lantern
version: "0.1.0"
config-version: 2
profile: lantern

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Thresholds used by the intermediate and mart layers. Changing one here changes every model.
  long_gap_ratio: 1.5          # actual headway / scheduled headway above this = long gap
  bunched_ratio: 0.5           # actual headway / scheduled headway below this = bunched
  late_trip_seconds: 300       # a trip running this much over its scheduled run time counts as late
  travel_outlier_seconds: 1800 # a stop-to-stop run above this is a long run: kept in every figure and also shown on its own
  incremental_lookback_days: 3 # LAMP republishes recent days; reprocess this many trailing days
  rider_basis_days: 56         # days of gated entries used to estimate riders exposed
  # Decision metrics (rider time lost, segments, trends). See README "Decision metrics".
  wait_max_headway_seconds: 3600 # gaps over 1 hour (usually suspensions): kept in their own columns, wait shown with and without them
  worse_recent_days: 14        # "getting worse": the last N service dates ...
  worse_prior_days: 28         # ... compared with the N dates before them
  worst_window_days: 14        # worst window: the N consecutive calendar days with the largest share of a segment's train delay
  completeness_min_share: 0.8  # completeness: a line-day is flagged low when trips compared / trips scheduled is below this
  tie_t: 1.96                  # worst line: a day-paired difference with |t| below this reads as a tie
  bunched_max_seconds: 120     # bunched: a departure less than this after the previous train (SFMTA rule, via Swiftly)
  gapped_extra_seconds: 300    # gapped: a gap more than the scheduled gap plus this (SFMTA rule, via Swiftly)
  survey_min_respondents: 30   # survey: cells with fewer respondents are suppressed on the board (share and margin set to null)
  worse_min_volume_recent: 300 # flag only with at least this many train runs (segments) or departures
  worse_min_volume_prior: 600  #   (stations) in each window, about 21 a day
  worse_min_delta_seconds: 5   # and only if excess per train run (or per rider) rose by at least this
  cause_min_runs_per_day: 20   # schedule-or-service split: a day counts if the segment had this many runs
  cause_min_days: 20           # classify only segments with at least this many such days
  cause_dominance_ratio: 2     # 'schedule' if |median daily excess| >= ratio x IQR, 'service' if IQR >= ratio x |median|
  # Latest day and charts (see README "One day against a typical day").
  typical_days: 28             # typical value = the N most recent earlier service dates of the same day type
  usual_min_volume: 20         # worse/about/better than usual only with at least this many trips, runs or departures
  usual_min_typical_days: 4    # ... and at least this many earlier dates of the same day type
  histogram_min_minutes: -15   # delay histogram: 1-minute bins from this ...
  histogram_max_minutes: 30    # ... to this; values outside go to the open bins at each end
  walk_speed_m_per_s: 1.4      # Freedom Trail walk estimate: straight-line metres / this speed
  # GTFS "as of" date (YYYYMMDD) for the station snapshot. Empty = latest loaded service date.
  gtfs_as_of: ""

  # Loading (all sources are read in place by DuckDB; see models/staging/_sources.yml)
  use_sample: false            # true = read the committed sample in data/sample/ (offline, CI)
  lamp_window_days: 90         # full refresh: this many complete service dates, ending yesterday
  # lamp_start_date / lamp_end_date (YYYY-MM-DD): optional fixed window, e.g.
  #   --vars '{lamp_start_date: 2026-07-09, lamp_end_date: 2026-10-06}'
  gtfs_years: [2026]           # GTFS archive years to read; must cover the LAMP window
  refresh_reference: false     # true = re-read GTFS and Open Data files into their staging tables
  check_incremental: false     # true = enable the tests in tests/incremental/ (see README)
  check_build: false           # true = enable tests/assert_build_has_no_failures.sql (see README)

on-run-end:
  - "{{ write_build_outputs(results) }}"

models:
  lantern:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
      +access: protected
    marts:
      +materialized: table
      +schema: marts
      +access: public
    exports:
      # Parquet files in out/ for the board (DuckDB-WASM). Each also registers a view in
      # the `exports` schema so tests can query it.
      +schema: exports
      +materialized: external
      +format: parquet
      +options:
        compression: zstd

seeds:
  lantern:
    +schema: reference

snapshots:
  lantern:
    +schema: snapshots

flags:
  require_generic_test_arguments_property: true
  send_anonymous_usage_stats: false  # no usage tracking calls, and no tracking script in the docs page
