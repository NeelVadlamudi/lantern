version: 2

seeds:
  - name: service_periods
    description: >
      MBTA weekday time periods, MBTA Service Delivery Policy (December 2025), Table 1.
      Minutes after midnight, inclusive. Night (00:00-02:59) is the tail of the previous service day.
    config:
      column_types:
        start_minute: integer
        end_minute: integer
        sort_order: integer
    columns:
      - name: service_period_id
        data_tests:
          - unique
          - not_null
  - name: line_display
    description: Display names and chart order for the eight subway routes.
    columns:
      - name: route_id
        data_tests:
          - unique
          - not_null
  - name: red_line_branches
    description: Red Line branch ids as LAMP uses them, keyed by the branch terminal station.
    columns:
      - name: branch_route_id
        data_tests:
          - unique
  - name: holidays
    description: 2026 federal and Massachusetts holidays. Used to split out holiday service in day_type.
    config:
      column_types:
        holiday_date: date
    columns:
      - name: holiday_date
        data_tests:
          - unique
  - name: gated_entry_lines
    description: Maps the gated-entry feed's route_or_line labels to trunk line ids (Silver Line excluded).
    columns:
      - name: route_or_line
        data_tests:
          - unique
  - name: line_name_map
    description: >
      Maps the line names used by the Commuter Rail reliability and boardings files and the 2025
      passenger survey to GTFS route ids (Commuter Rail) or line ids (subway). One row per dataset
      and source name; note says why a name maps where it does. Names that are not in the
      current GTFS (CR-Middleborough, CapeFlyer) keep their own id and stay out of the Commuter
      Rail totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [dataset, source_name]
    columns:
      - name: dataset
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cr_reliability, cr_boardings, survey]
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: [subway, commuter_rail]
  - name: board_glossary
    description: Plain-language glossary shown on the board (board_data.json glossary).
    config:
      column_types:
        sort_order: integer
    columns:
      - name: term
        data_tests:
          - unique
          - not_null
  - name: board_sources
    description: Data sources listed on the board (board_data.json meta.sources), with their terms.
    config:
      column_types:
        sort_order: integer
    columns:
      - name: name
        data_tests:
          - unique
          - not_null
  - name: duration_label_boundaries
    description: >
      Durations in seconds at every unit boundary of format_duration and around each rounding
      step. board_duration_label_cases labels them and the hook writes
      out/duration_label_cases.json for the board's own formatter to be tested against.
    config:
      column_types:
        sort_order: integer
        seconds: double
    columns:
      - name: sort_order
        data_tests:
          - unique
          - not_null
      - name: seconds
        data_tests:
          - unique
          - not_null
