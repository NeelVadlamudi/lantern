version: 2

models:
  - name: stg_lamp__subway_trip_stops
    description: >
      LAMP subway trip-stop rows, renamed and typed. Grain: one row per service date, trip,
      route, vehicle and stop. Rows repeated at that grain are deduplicated (latest load wins).
    columns:
      - name: trip_stop_event_key
        description: Surrogate key of service_date, trip_id, route_id, vehicle_label, stop_id.
        data_tests:
          - unique
          - not_null
      - name: service_date
        data_tests:
          - not_null
      - name: route_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Red, Mattapan, Orange, Green-B, Green-C, Green-D, Green-E, Blue]
      - name: branch_route_id
        description: LAMP branch id (Red-A, Red-B, Green-B..E), falling back to route_id.
        data_tests:
          - accepted_values:
              arguments:
                values: [Red, Red-A, Red-B, Mattapan, Orange, Green-B, Green-C, Green-D, Green-E, Blue]
              config:
                severity: warn
      - name: line_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Red, Mattapan, Orange, Green, Blue]
      - name: direction_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: station_id
        data_tests:
          - not_null
      - name: stop_id
        data_tests:
          - not_null
      - name: scheduled_headway_trunk_seconds
        description: Scheduled trunk headway. Zero values are a known source issue (see README findings).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                where: scheduled_headway_trunk_seconds is not null
              config:
                severity: warn

  - name: stg_gtfs__stops
    description: >
      GTFS stops, all archive versions. Grain: one row per stop id and archive validity range.
      LAMP stores validity per record, so a stop can have several rows starting the same day
      with different end dates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [stop_id, valid_from_date, valid_to_date]
    columns:
      - name: stop_id
        data_tests:
          - not_null

  - name: stg_gtfs__routes
    description: "GTFS routes, all archive versions. Grain: one row per route id and version."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route_id, valid_from_date, valid_to_date]

  - name: stg_gtfs__route_patterns
    description: "GTFS route patterns, all archive versions. Grain: one row per pattern and version."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route_pattern_id, valid_from_date, valid_to_date]

  - name: stg_gtfs__stop_times
    description: >
      GTFS stop_times for representative trips of subway route patterns.
      Grain: one row per trip, stop sequence and version.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, stop_sequence, valid_from_date, valid_to_date]

  - name: stg_gtfs__trips
    description: >
      GTFS trips for representative trips of subway route patterns.
      Grain: one row per trip and archive validity range.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, valid_from_date, valid_to_date]

  - name: stg_gtfs__shapes
    description: >
      GTFS shape points for those trips. Grain: one row per shape, point sequence and archive
      validity range.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [shape_id, shape_point_sequence, valid_from_date, valid_to_date]

  - name: stg_mbta__gated_entries
    description: "Fare-gate entries. Grain: one row per service date, station, line and 30-minute bin."
    columns:
      - name: service_date
        data_tests:
          - not_null
      - name: station_id
        description: >
          Parent station id. A few source rows have a blank stop_id (12 Longwood rows in the
          current file); they can't be joined to a station and are dropped in
          int_station_period_riders. The warn test keeps the count visible.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: bin_start_minute
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1410
      - name: gated_entries
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_mbta__monthly_ridership
    description: "Monthly ridership by mode and line (NTD). Grain: one row per month, day type and mode/line."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start_date, day_type, route_or_line]
    columns:
      - name: day_type
        data_tests:
          - accepted_values:
              arguments:
                values: [weekday, saturday, sunday, total]

  - name: stg_gtfs__cr_trips
    description: >
      GTFS trips for the representative trips of canonical Commuter Rail route patterns (CR- routes).
      Grain: one row per trip and archive validity range.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, valid_from_date, valid_to_date]
    columns:
      - name: route_id
        data_tests:
          - not_null

  - name: stg_gtfs__cr_stop_times
    description: >
      GTFS stop_times for the trips in stg_gtfs__cr_trips.
      Grain: one row per trip, stop sequence and version.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, stop_sequence, valid_from_date, valid_to_date]

  - name: stg_gtfs__cr_shapes
    description: >
      GTFS shape points for the trips in stg_gtfs__cr_trips. Grain: one row per shape, point
      sequence and archive validity range.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [shape_id, shape_point_sequence, valid_from_date, valid_to_date]

  - name: stg_mbta__cr_reliability
    description: >
      Commuter Rail reliability counts. Grain: one row per source row (service date, route, line
      or branch name, peak/off-peak); two branches can share a name before 2025-03-24, so the key
      covers every column. on_time_trips / counted_trips are otp_numerator / otp_denominator;
      cancelled_trips is cancelled_numerator.
    columns:
      - name: cr_reliability_row_key
        data_tests:
          - unique
          - not_null
      - name: service_date
        data_tests:
          - not_null
      - name: source_route_id
        data_tests:
          - not_null
      - name: source_line_name
        data_tests:
          - not_null
      - name: peak_offpeak
        data_tests:
          - accepted_values:
              arguments:
                values: [PEAK, OFF_PEAK]
      - name: on_time_trips
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: counted_trips
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cancelled_trips
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "on_time_trips <= counted_trips"

  - name: stg_mbta__cr_boardings
    description: >
      Commuter Rail boardings by line and day. estimated_boardings is the MBTA's own estimate
      (scaled conductor counts). Grain: one row per service date and line name.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [service_date, source_line_name]
    columns:
      - name: source_line_name
        data_tests:
          - not_null
      - name: estimated_boardings
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_mbta__passenger_survey
    description: >
      MBTA 2025 System-Wide Passenger Survey. Grain: one row per aggregation level, service mode,
      reporting group, measure and category.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [aggregation_level, service_mode, reporting_group, measure, category]
    columns:
      - name: weighted_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: respondents
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
