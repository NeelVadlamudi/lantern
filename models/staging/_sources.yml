version: 2

# Every source is a public file read directly by DuckDB (httpfs), with no copy step.
# `external_location` is the read expression that {{ source() }} renders to.
# --vars '{use_sample: true}' points every source at the small committed copies in data/sample/.
# The *_url vars override a location (for example a local mirror).

sources:
  - name: lamp
    description: >
      MBTA LAMP (Lightweight Application for Measuring Performance) public exports.
      https://performancedata.mbta.com. Subway on-time performance is published as one Parquet
      file per service date; the index lists every file. stg_lamp__subway_trip_stops reads the
      files it needs straight from the URLs in the index (see macros/lamp_files.sql).
    tables:
      - name: lamp_index
        description: >
          index.csv of the subway on-time performance files: one row per service date with the
          file URL, size and last-modified time. Read as text; dates are cast where used. Field definitions for the files themselves:
          https://github.com/mbta/lamp/blob/main/Data_Dictionary.md
        config:
          external_location: >-
            read_csv('{{ var('lamp_index_url', 'data/sample/lamp/index.csv' if var('use_sample', false)
            else 'https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/index.csv') }}',
            header = true, all_varchar = true)
          loaded_at_field: "cast(service_date as timestamp)"
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
        columns:
          - name: service_date
            description: Service date of the file.
            data_tests:
              - not_null
          - name: file_url
            description: URL of the Parquet file for that service date.
            data_tests:
              - not_null

      - name: lamp_rt_alerts
        description: >
          LAMP archive of the MBTA GTFS-realtime service alerts feed (LAMP_RT_ALERTS), one row per
          alert version, informed entity and active period, from 2019 on. Timestamps are local
          (America/New_York) datetimes. Read in place; staging keeps subway and light rail alerts.
          https://github.com/mbta/lamp/blob/main/Data_Dictionary.md (LAMP_RT_ALERTS)
        config:
          external_location: >-
            read_parquet('{{ var('lamp_alerts_url', 'data/sample/lamp/LAMP_RT_ALERTS.parquet'
            if var('use_sample', false)
            else 'https://performancedata.mbta.com/lamp/tableau/alerts/LAMP_RT_ALERTS.parquet') }}')
        columns:
          - name: id
            description: Alert id.
            data_tests:
              - not_null

  - name: gtfs
    description: >
      LAMP compressed GTFS archive. Every GTFS schedule the MBTA has published, one Parquet file
      per year and GTFS file. gtfs_active_date / gtfs_end_date (YYYYMMDD) give the service dates
      each record applied to. https://performancedata.mbta.com/lamp/gtfs_archive/
      Years read: var('gtfs_years') (default [2026]); the test assert_gtfs_covers_lamp_window
      fails if the LAMP window needs a year that is not listed.
    config:
      external_location: >-
        read_parquet([{% for y in var('gtfs_years', [2026]) %}'{{ var('gtfs_archive_url',
        'data/sample/gtfs' if var('use_sample', false) else 'https://performancedata.mbta.com/lamp/gtfs_archive')
        }}/{{ y }}/{identifier}.parquet'{{ ', ' if not loop.last }}{% endfor %}], union_by_name = true)
    tables:
      - name: gtfs_stops
        identifier: stops
        description: GTFS stops.txt rows, all versions for the listed years.
      - name: gtfs_routes
        identifier: routes
        description: GTFS routes.txt rows, all versions for the listed years.
      - name: gtfs_route_patterns
        identifier: route_patterns
        description: MBTA GTFS extension route_patterns.txt, all versions for the listed years.
      - name: gtfs_stop_times
        identifier: stop_times
        description: >
          GTFS stop_times.txt (about 80 MB a year). Staging keeps only the representative trip of
          each subway route pattern.
      - name: gtfs_trips
        identifier: trips
        description: GTFS trips.txt. Staging keeps only representative trips of subway route patterns.
      - name: gtfs_shapes
        identifier: shapes
        description: GTFS shapes.txt. Staging keeps only the shapes of those representative trips.
      - name: gtfs_calendar
        identifier: calendar
        description: GTFS calendar.txt (weekly service patterns per service_id), all versions for the listed years.
      - name: gtfs_calendar_dates
        identifier: calendar_dates
        description: GTFS calendar_dates.txt (added and removed service per date), all versions for the listed years.

  - name: mbta_open_data
    description: >
      MBTA Open Data Portal (ArcGIS Hub) CSV downloads, read as text.
      https://mbta-massdot.opendata.arcgis.com
    tables:
      - name: mbta_gated_station_entries
        description: >
          Fare gate entries by station, line and 30-minute period per service date
          (hub item 001c177f07594e7c99f193dde32284c9). Counts can be fractional: the MBTA
          splits entries at shared stations across lines.
        config:
          external_location: >-
            read_csv('{{ var('gated_entries_url', 'data/sample/opendata/gated_station_entries.csv.gz'
            if var('use_sample', false)
            else 'https://mbta-massdot.opendata.arcgis.com/api/download/v1/items/001c177f07594e7c99f193dde32284c9/csv?layers=0') }}',
            header = true, all_varchar = true)
        columns:
          - name: service_date
          - name: time_period
            description: "Start of the 30-minute bin, e.g. \"(07:30:00)\"."
          - name: stop_id
            description: Parent station id (place-*).
          - name: route_or_line
          - name: gated_entries
      - name: mbta_monthly_ridership
        description: >
          Monthly ridership by mode and line as reported to the National Transit Database
          (hub item 2048258a18354256a650d41f8fe4532c).
        config:
          external_location: >-
            read_csv('{{ var('monthly_ridership_url', 'data/sample/opendata/monthly_ridership_by_mode_line.csv.gz'
            if var('use_sample', false)
            else 'https://mbta-massdot.opendata.arcgis.com/api/download/v1/items/2048258a18354256a650d41f8fe4532c/csv?layers=0') }}',
            header = true, all_varchar = true)
      - name: mbta_cr_reliability
        description: >
          Commuter Rail reliability by route, day and peak/off-peak (hub item
          ec18161c237d419698abc767f1be6a50, CSV). otp_numerator / otp_denominator are the trips
          counted as on time and the trips counted, cancelled_numerator the cancelled trips, kept
          apart so routes and days can be combined before dividing. Definitions: MBTA Performance
          Dashboard and Service Delivery Policy.
        config:
          external_location: >-
            read_csv('{{ var('cr_reliability_url', 'data/sample/opendata/cr_reliability.csv.gz'
            if var('use_sample', false)
            else 'https://www.arcgis.com/sharing/rest/content/items/ec18161c237d419698abc767f1be6a50/data') }}',
            header = true, all_varchar = true)
        columns:
          - name: service_date
            description: "Service date as M/D/YYYY."
          - name: gtfs_route_id
          - name: gtfs_route_long_name
            description: Line or branch name; several names can share one route id (see seeds/line_name_map.csv).
          - name: peak_offpeak_ind
            description: PEAK or OFF_PEAK.
          - name: metric_type
          - name: otp_numerator
          - name: otp_denominator
          - name: cancelled_numerator
      - name: mbta_cr_boardings
        description: >
          Commuter Rail ridership by service date and line (hub item 59b5c61e8e9f42f9a3745f7ad63d07d6,
          CSV). estimated_boardings is the MBTA's own estimate from scaled conductor counts; values
          are not guaranteed complete for every line or date.
        config:
          external_location: >-
            read_csv('{{ var('cr_boardings_url', 'data/sample/opendata/cr_boardings.csv.gz'
            if var('use_sample', false)
            else 'https://www.arcgis.com/sharing/rest/content/items/59b5c61e8e9f42f9a3745f7ad63d07d6/data') }}',
            header = true, all_varchar = true)
        columns:
          - name: servicedate
            description: Service date as YYYY-MM-DD.
          - name: line
            description: Line name (see seeds/line_name_map.csv).
          - name: estimated_boardings
      - name: mbta_passenger_survey_2025
        description: >
          MBTA 2025 System-Wide Passenger Survey results (hub item 2dac9c48bd3440c2bcf2a220614c667b,
          CSV download of layer 0). One row per aggregation level, service mode, reporting group,
          measure and category, with the weighted share of riders, the respondents (n) and the
          margin of error.
        config:
          external_location: >-
            read_csv('{{ var('passenger_survey_url', 'data/sample/opendata/passenger_survey_2025.csv.gz'
            if var('use_sample', false)
            else 'https://mbta-massdot.opendata.arcgis.com/api/download/v1/items/2dac9c48bd3440c2bcf2a220614c667b/csv?layers=0') }}',
            header = true, all_varchar = true)
        columns:
          - name: aggregation_level
          - name: service_mode
          - name: reporting_group
          - name: measure_group
          - name: measure
          - name: category
          - name: weighted_percent
            description: Weighted share of riders in the category, 0 to 1.
          - name: n
            description: Respondents who were asked the question.
          - name: margin_of_error
            description: Margin of error of weighted_percent, 0 to 1.
