      - name: is_planned_change
        data_type: boolean
        description: 'The line (Green and system: any of their routes) had a planned service change that day. Shown and labelled in the day view; the day is never used in a typical value.'
        data_tests: [not_null]
      - name: station_id
        data_type: varchar
        description: 'GTFS parent station id (place-*).'
      - name: headway_observations
        data_type: bigint
        description: 'Headway observations.'
      - name: long_gaps
        data_type: bigint
        description: 'Long gaps.'
      - name: long_gap_share
        data_type: double
        description: 'Long gap share: exact numerator / denominator from the columns in this row.'
      - name: day_rank
        data_type: bigint
        description: 'Rank within scope and date (1 = worst).'
      - name: typical_days
        data_type: bigint
        description: 'Earlier service dates of the same day type used for the typical value (up to var typical_days).'
      - name: typical_median_long_gaps
        data_type: double
        description: 'Typical median of long_gaps over the earlier same-day-type dates.'
      - name: typical_mean_long_gaps
        data_type: double
        description: 'Typical mean of long_gaps over the earlier same-day-type dates.'
      - name: diff_vs_median_long_gaps
        data_type: double
        description: 'The days value minus the typical value named in the column.'
      - name: diff_vs_mean_long_gaps
        data_type: double
        description: 'The days value minus the typical value named in the column.'
      - name: typical_median_long_gap_share
        data_type: double
        description: 'Typical median of long_gap_share over the earlier same-day-type dates.'
      - name: typical_mean_long_gap_share
        data_type: double
        description: 'Typical mean of long_gap_share over the earlier same-day-type dates.'
      - name: diff_vs_median_long_gap_share
        data_type: double
        description: 'The days value minus the typical value named in the column.'
      - name: diff_vs_mean_long_gap_share
        data_type: double
        description: 'The days value minus the typical value named in the column.'

