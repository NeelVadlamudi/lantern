  - name: mart_delay_histogram
    description: >-
      Grain: one row per kind, scope, service date and non-empty 1-minute bin of excess time. Open bins at each end; observations over all bins equal total_observations.
    config:
      contract:
        enforced: true
    columns:
      - name: histogram_bin_key
        data_type: varchar
        description: 'Surrogate key of the row.'
        data_tests:
          - unique
          - not_null
      - name: kind
        data_type: varchar
        description: '''trip'' (per-trip excess) or ''run'' (per stop-to-stop run excess).'
      - name: scope_id
        data_type: varchar
        description: '''system'' (all subway routes) or a GTFS route id; for Commuter Rail and survey marts see the model description.'
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: date_key
        data_type: integer
        description: 'Service date as YYYYMMDD.'
      - name: day_type
        data_type: varchar
        description: 'weekday, saturday, sunday or holiday.'
      - name: bin_minute
        data_type: integer
        description: 'Lower edge of the 1-minute bin in minutes; the lowest and highest bins are open.'
      - name: bin_start_seconds
        data_type: integer
        description: 'Bin start seconds, exact.'
      - name: bin_end_seconds
        data_type: integer
        description: 'Bin end seconds, exact.'
      - name: is_open_bin
        data_type: boolean
        description: 'True for the open bottom and top bins.'
      - name: bin_label
        data_type: varchar
        description: 'Readable bin label.'
      - name: observations
        data_type: bigint
        description: 'Observations.'
      - name: excess_seconds_sum
        data_type: double
        description: 'Excess seconds sum.'
      - name: total_observations
        data_type: bigint
        description: 'Total observations.'
      - name: share_of_observations
        data_type: double
        description: 'Share of observations.'

  - name: mart_train_delay_by_line
    description: >-
      Grain: one row per period (a date, all weekdays or all days) and route. Each routes positive train delay and its share of the subway total; shares in a period add up to 1.
    config:
      contract:
        enforced: true
    columns:
      - name: line_period_key
        data_type: varchar
        description: 'Surrogate key of the row.'
        data_tests:
          - unique
          - not_null
      - name: period_kind
        data_type: varchar
        description: '''date'', ''weekday'' or ''all_days''.'
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: route_id
        data_type: varchar
        description: 'GTFS route id.'
      - name: service_dates
        data_type: bigint
        description: 'Service dates.'
      - name: runs_compared
        data_type: bigint
        description: 'Runs compared.'
      - name: positive_excess_seconds
        data_type: double
        description: 'Positive excess seconds, exact.'
      - name: net_excess_seconds
        data_type: double
        description: 'Net excess seconds, exact.'
      - name: avg_daily_positive_excess_seconds
        data_type: double
        description: 'Avg daily positive excess seconds, exact.'
      - name: system_positive_excess_seconds
        data_type: double
        description: 'System positive excess seconds, exact.'
      - name: share_of_positive_excess
        data_type: double
        description: 'Share of positive excess.'
  - name: mart_headway_adherence
    description: >
      Grain: one row per scope ('system' or a subway route id), service date and service hour.
      Bunched (headway under var bunched_max_seconds, 120 s) and gapped (headway over the scheduled
      headway plus var gapped_extra_seconds, 300 s) departures among departures with a headway
      comparison: the SFMTA rules as described by Swiftly
      (https://www.goswift.ly/blog/how-well-is-america-sticking-to-its-promised-headways).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scope_id, service_date, service_hour]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "bunched_departures + gapped_departures <= departures_compared"
    columns:
      - name: scope_id
        data_type: varchar
        description: "'system' or a subway route id."
        data_tests: [not_null]
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: date_key
        data_type: integer
        description: 'Service date as YYYYMMDD.'
      - name: day_type
        data_type: varchar
        description: 'weekday, saturday, sunday or holiday.'
      - name: service_hour
        data_type: integer
        description: 'Hour of the service day (after-midnight trains count as 24 and up).'
      - name: departures_compared
        data_type: bigint
        description: 'Departures with actual and scheduled trunk headway both known and above zero.'
      - name: bunched_departures
        data_type: bigint
        description: 'Departures less than 120 s after the previous train at the stop.'
      - name: gapped_departures
        data_type: bigint
        description: 'Departures whose gap was more than the scheduled gap plus 300 s.'
      - name: bunched_share
        data_type: double
        description: 'bunched_departures / departures_compared.'
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: gapped_share
        data_type: double
        description: 'gapped_departures / departures_compared.'
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
  - name: mart_line_day_completeness
    description: >
      Grain: one row per scope ('system' or a subway route id) and service date in the window.
      Scheduled trips with a compared run under their own trip id against trips in the GTFS
      schedule published for the date (int_scheduled_subway_trips), so completeness_share is at
      most 1. Unmatched and added runs and dropped duplicate stop events are counted separately.
      is_low_completeness when completeness_share is below var completeness_min_share (0.8).
      is_planned_change marks planned service changes (mart_planned_change_line_days).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scope_id, service_date]
    columns:
      - name: scope_id
        data_type: varchar
        description: "'system' or a subway route id."
        data_tests: [not_null]
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: date_key
        data_type: integer
        description: 'Service date as YYYYMMDD.'
      - name: day_type
        data_type: varchar
        description: 'weekday, saturday, sunday or holiday.'
      - name: scheduled_trips
        data_type: bigint
        description: 'Trips in the GTFS schedule for that date (0 when none).'
      - name: trips_observed
        data_type: bigint
        description: 'Train runs LAMP recorded, duplicate stop events removed (fct_trips; one per trip and vehicle).'
      - name: trips_compared
        data_type: bigint
        description: 'Same as matched_trips_compared (the completeness numerator).'
      - name: matched_trips_compared
        data_type: bigint
        description: 'Scheduled trips with at least one compared run under their own trip id; never above scheduled_trips.'
        data_tests: [not_null]
      - name: matched_runs_compared
        data_type: bigint
        description: 'Compared runs whose trip id is scheduled that date: the late-share denominator.'
      - name: unmatched_runs_compared
        data_type: bigint
        description: 'Compared runs whose trip id is not in the day schedule (not in the late share).'
      - name: added_runs_compared
        data_type: bigint
        description: 'Of unmatched_runs_compared, runs with ADDED- trip ids.'
      - name: duplicate_stop_events_dropped
        data_type: bigint
        description: 'Stop events dropped as the same train recorded twice (fct_trip_stop_events).'
      - name: completeness_share
        data_type: double
        description: 'matched_trips_compared / scheduled_trips; null with no scheduled trips; at most 1.'
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: completeness_min_share
        data_type: double
        description: 'The threshold used (var completeness_min_share).'
      - name: is_low_completeness
        data_type: boolean
        description: 'True when trips_compared is below completeness_min_share x scheduled_trips (a day with no trips compared and none scheduled is not low).'
        data_tests: [not_null]
      - name: is_planned_change
        data_type: boolean
        description: 'A line with a planned service change that day; for system, any line.'
        data_tests: [not_null]
      - name: planned_change_lines
        data_type: bigint
        description: 'Routes with a planned change that day (0 or 1 for a route).'
      - name: planned_change_label
        data_type: varchar
        description: 'Plain label of the change; null without one.'
