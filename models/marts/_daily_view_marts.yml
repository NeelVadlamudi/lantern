version: 2

models:
  - name: mart_line_day_metrics
    description: >-
      Grain: one row per scope (system, route, or Green = all four Green Line branches combined), service date and measure. Each days value with the typical value for the same day type over the earlier var typical_days dates with data, and the exact difference.
    config:
      contract:
        enforced: true
    columns:
      - name: line_day_measure_key
        data_type: varchar
        description: 'Surrogate key of the row.'
        data_tests:
          - unique
          - not_null
      - name: scope_id
        data_type: varchar
        description: '''system'' (all subway routes), a GTFS route id, or ''Green'' (Green-B, -C, -D and -E combined); for Commuter Rail and survey marts see the model description.'
        data_tests:
          - not_null
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: date_key
        data_type: integer
        description: 'Service date as YYYYMMDD.'
      - name: day_type
        data_type: varchar
        description: 'weekday, saturday, sunday or holiday.'
      - name: is_planned_change
        data_type: boolean
        description: 'The scope had a planned service change that day (Green and system: any of their routes). The row is kept and labelled but is never used in a typical value.'
        data_tests: [not_null]
      - name: planned_change_lines
        data_type: bigint
        description: 'Routes in the scope with a planned change that day.'
        data_tests: [not_null]
      - name: planned_change_label
        data_type: varchar
        description: 'Plain label of the change types; null without one.'
      - name: measure
        data_type: varchar
        description: 'Measure name.'
      - name: unit
        data_type: varchar
        description: 'count, share (0 to 1), seconds, or ratio (completeness_share: scheduled trips compared over trips scheduled, at most 1).'
      - name: value
        data_type: double
        description: 'The days value of the measure.'
      - name: numerator
        data_type: double
        description: 'Numerator of a share or per-run value (null for plain counts).'
      - name: denominator
        data_type: double
        description: 'Denominator of a share or per-run value (null for plain counts).'
      - name: typical_days
        data_type: bigint
        description: 'Earlier service dates of the same day type, without a planned change, used for the typical value (up to var typical_days; 0 when none).'
      - name: typical_days_n
        data_type: bigint
        description: 'Clean comparable earlier days (same day type, no planned change) behind the typical value; same count as typical_days.'
        data_tests: [not_null]
      - name: typical_is_thin
        data_type: boolean
        description: 'True when typical_days_n is below var typical_min_days (3): typical median, mean, p25, p75 and the differences are null.'
        data_tests: [not_null]
      - name: typical_first_date
        data_type: date
        description: 'First date used for the typical value.'
      - name: typical_last_date
        data_type: date
        description: 'Last date used for the typical value.'
      - name: typical_median
        data_type: double
        description: 'Typical median.'
      - name: typical_mean
        data_type: double
        description: 'Typical mean.'
      - name: typical_p25
        data_type: double
        description: 'Typical p25.'
      - name: typical_p75
        data_type: double
        description: 'Typical p75.'
      - name: diff_vs_median
        data_type: double
        description: 'The days value minus the typical value named in the column.'
      - name: diff_vs_mean
        data_type: double
        description: 'The days value minus the typical value named in the column.'

  - name: mart_segment_day_delay
    description: >-
      Grain: one row per scope, service date and segment. Train delay on the segment that day, day_rank by positive seconds, and the typical value for the same day type.
    config:
      contract:
        enforced: true
    columns:
      - name: segment_day_scope_key
        data_type: varchar
        description: 'Surrogate key of the row.'
        data_tests:
          - unique
          - not_null
      - name: scope_id
        data_type: varchar
        description: '''system'' (all subway routes) or a GTFS route id; for Commuter Rail and survey marts see the model description.'
      - name: service_date
        data_type: date
        description: 'Service date.'
      - name: date_key
        data_type: integer
        description: 'Service date as YYYYMMDD.'
      - name: day_type
        data_type: varchar
        description: 'weekday, saturday, sunday or holiday.'
      - name: is_planned_change
        data_type: boolean
        description: 'The line (Green and system: any of their routes) had a planned service change that day. Shown and labelled in the day view; the day is never used in a typical value.'
        data_tests: [not_null]
      - name: segment_id
        data_type: varchar
        description: 'Track segment id (dim_segments).'
      - name: line_id
        data_type: varchar
        description: 'Trunk line id.'
      - name: direction_id
        data_type: integer
        description: 'GTFS direction id.'
      - name: from_station_id
        data_type: varchar
        description: 'From station id.'
      - name: to_station_id
        data_type: varchar
        description: 'To station id.'
      - name: runs_compared
        data_type: bigint
        description: 'Runs compared.'
      - name: positive_excess_seconds
        data_type: double
        description: 'Positive excess seconds, exact.'
      - name: net_excess_seconds
        data_type: double
        description: 'Net excess seconds, exact.'
      - name: positive_excess_per_run_seconds
        data_type: double
        description: 'Positive excess per run seconds, exact.'
      - name: net_excess_per_run_seconds
        data_type: double
        description: 'Net excess per run seconds, exact.'
      - name: day_rank
        data_type: bigint
        description: 'Rank within scope and date (1 = worst).'
      - name: typical_days
        data_type: bigint
        description: 'Earlier service dates of the same day type used for the typical value (up to var typical_days).'
      - name: typical_median_positive_seconds
        data_type: double
        description: 'Typical median of positive_seconds over the earlier same-day-type dates.'
      - name: typical_mean_positive_seconds
        data_type: double
        description: 'Typical mean of positive_seconds over the earlier same-day-type dates.'
      - name: diff_vs_median_seconds
        data_type: double
        description: 'The days value minus the typical value named in the column.'
      - name: diff_vs_mean_seconds
        data_type: double
        description: 'The days value minus the typical value named in the column.'

  - name: mart_station_day_gaps
    description: >-
      Grain: one row per scope, service date and station. Long gaps and headway observations that day, day_rank by long gaps, and the typical value for the same day type.
    config:
      contract:
        enforced: true
    columns:
      - name: station_day_scope_key
        data_type: varchar
        description: 'Surrogate key of the row.'
        data_tests:
