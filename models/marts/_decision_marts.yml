version: 2
models:
  - name: dim_segments
    description: 'Track segments: pairs of consecutive stations on the canonical route pattern of a line, one direction.
      Grain: one row per segment. Shared track between branches is one segment.'
    config:
      contract:
        enforced: true
    columns:
      - name: segment_id
        data_type: varchar
        description: 'Surrogate key: line_id, direction_id, from_station_id, to_station_id. Joins to dim_segments.'
        data_tests:
          - unique
          - not_null
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: route_id
        data_type: varchar
        description: GTFS route id of the branch whose shape draws the segment.
      - name: direction_id
        data_type: integer
        description: 'GTFS direction: 0 or 1.'
        data_tests:
          - not_null
      - name: from_station_id
        data_type: varchar
        description: Station the segment starts at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: from_station_name
        data_type: varchar
        description: Name of the start station.
      - name: to_station_id
        data_type: varchar
        description: Station the segment ends at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: to_station_name
        data_type: varchar
        description: Name of the end station.
      - name: segment_name
        data_type: varchar
        description: '''<start station> to <end station>''.'
        data_tests:
          - not_null
      - name: branch_route_ids
        data_type: varchar[]
        description: Branches (GTFS route or Red Line branch ids) that run over the segment.
      - name: from_stop_order
        data_type: integer
        description: Position of the start station on the pattern (for ordering).
      - name: is_terminal_departure
        data_type: boolean
        description: 'True when the start station is the first stop of the canonical pattern of the branch (for
          a segment: of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: is_terminal_arrival
        data_type: boolean
        description: 'True when the end station is the last stop of the canonical pattern of the branch (for a segment:
          of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: geometry
        data_type: double[][]
        description: Track geometry as a list of [lon, lat] points (WGS84).
        data_tests:
          - not_null
      - name: geometry_source
        data_type: varchar
        description: '''shape'' (GTFS shapes.txt slice) or ''straight_line'' (between the two stations).'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - shape
                  - straight_line
      - name: straight_line_meters
        data_type: double
        description: Great-circle distance between the two stations, meters.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - line_id
              - direction_id
              - from_station_id
              - to_station_id
  - name: fct_segment_traversals
    description: One row per observed train run over a segment, compared to the schedule or not (run_comparison_status).
      Run times, the terminal split and the excess come from int_train_runs.
    config:
      contract:
        enforced: true
    columns:
      - name: segment_traversal_key
        data_type: varchar
        description: Same as fct_trip_stop_events.trip_stop_event_key of the arrival at the end station.
        data_tests:
          - unique
          - not_null
      - name: segment_id
        data_type: varchar
        description: 'Surrogate key: line_id, direction_id, from_station_id, to_station_id. Joins to dim_segments.'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segments')
                field: segment_id
      - name: trip_key
        data_type: varchar
        description: Trip key. Joins to fct_trips.
      - name: service_date
        data_type: date
        description: MBTA service date. Trips after midnight belong to the previous date.
        data_tests:
          - not_null
      - name: date_key
        data_type: integer
        description: Date as an integer YYYYMMDD. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: day_type
        data_type: varchar
        description: weekday, saturday, sunday or holiday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - weekday
                  - saturday
                  - sunday
                  - holiday
      - name: service_period_id
        data_type: varchar
        description: MBTA service period. Joins to dim_service_periods.
        data_tests:
          - not_null
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: route_id
        data_type: varchar
        description: GTFS route id of the branch whose shape draws the segment.
      - name: branch_route_id
        data_type: varchar
        description: Branch the train ran on.
      - name: direction_id
        data_type: integer
        description: 'GTFS direction: 0 or 1.'
        data_tests:
          - not_null
      - name: from_station_id
        data_type: varchar
        description: Station the segment starts at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: to_station_id
        data_type: varchar
        description: Station the segment ends at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: run_comparison_status
        data_type: varchar
        description: '''compared'', ''actual_missing'', ''scheduled_missing'', ''actual_not_positive'' or ''scheduled_not_positive''.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - compared
                  - actual_missing
                  - scheduled_missing
                  - actual_not_positive
                  - scheduled_not_positive
      - name: is_compared
        data_type: boolean
        description: run_comparison_status = 'compared'.
        data_tests:
          - not_null
      - name: is_long_run
        data_type: boolean
        description: Compared and run_seconds over travel_outlier_seconds (30 min). Kept and flagged.
        data_tests:
          - not_null
      - name: actual_run_seconds
        data_type: bigint
        description: 'Recorded run time: arrival here minus arrival at the start station (first observed segment:
          minus departure from it).'
      - name: run_seconds
        data_type: bigint
        description: 'actual_run_seconds minus terminal_hold_in_actual_seconds: the time compared with the schedule.'
      - name: scheduled_run_seconds
        data_type: bigint
        description: Scheduled arrival here minus scheduled departure at the start station.
      - name: net_excess_seconds
        data_type: bigint
        description: Run minus scheduled seconds (compared runs). Signed, not clamped.
      - name: positive_excess_seconds
        data_type: bigint
        description: 'max(run - scheduled, 0) seconds (compared runs): late time only.'
      - name: is_first_observed_segment
        data_type: boolean
        description: True for the run out of the trip's first observed stop.
      - name: arrived_start_at
        data_type: timestamp
        description: Arrival at the start station (Boston local, LAMP stop time).
      - name: departed_start_at
        data_type: timestamp
        description: Departure from the start station (Boston local, LAMP move time at the end station).
      - name: arrived_at
        data_type: timestamp
        description: Arrival at the end station (Boston local).
      - name: dwell_at_start_seconds
        data_type: bigint
        description: departed_start_at - arrived_start_at.
      - name: in_motion_seconds
        data_type: bigint
        description: arrived_at - departed_start_at.
      - name: recorded_span_seconds
        data_type: bigint
        description: arrived_at - arrived_start_at (= dwell + in motion).
      - name: is_terminal_departure
        data_type: boolean
        description: 'True when the start station is the first stop of the canonical pattern of the branch (for
          a segment: of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: is_terminal_arrival
        data_type: boolean
        description: 'True when the end station is the last stop of the canonical pattern of the branch (for a segment:
          of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: terminal_time_split
        data_type: varchar
        description: '''departure_hold_split'' (terminal hold split out from recorded times), ''departure_hold_not_recorded''
          (a timestamp is missing), ''arrival_not_split'' (LAMP has no timestamp for holding outside a terminal,
          so it stays in the run) or ''not_terminal''.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - departure_hold_split
                  - departure_hold_not_recorded
                  - arrival_not_split
                  - not_terminal
      - name: terminal_hold_seconds
        data_type: bigint
        description: 'Terminal departures: dwell_at_start_seconds, the recorded time on the terminal platform before
          leaving. Null otherwise.'
      - name: terminal_hold_in_actual_seconds
        data_type: bigint
        description: The terminal hold when it is inside actual_run_seconds (not the first observed segment); split
          out of run_seconds.
  - name: fct_suspension_gaps
    description: 'Every gap over wait_max_headway_seconds (1 hour) between trains at a platform, checked against
      the recorded departures. Grain: one row per departure that ended such a gap.'
    config:
      contract:
        enforced: true
    columns:
      - name: trip_stop_event_key
        data_type: varchar
        description: Key of the departure that ended the gap. Joins to fct_trip_stop_events.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_trip_stop_events')
                field: trip_stop_event_key
      - name: service_date
        data_type: date
        description: MBTA service date. Trips after midnight belong to the previous date.
        data_tests:
          - not_null
      - name: date_key
        data_type: integer
        description: Date as an integer YYYYMMDD. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: day_type
        data_type: varchar
        description: weekday, saturday, sunday or holiday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - weekday
                  - saturday
                  - sunday
                  - holiday
      - name: service_period_id
        data_type: varchar
        description: MBTA service period. Joins to dim_service_periods.
        data_tests:
          - not_null
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: route_id
        data_type: varchar
        description: GTFS route id of the branch whose shape draws the segment.
      - name: direction_id
        data_type: integer
        description: 'GTFS direction: 0 or 1.'
        data_tests:
          - not_null
      - name: station_id
        data_type: varchar
        description: GTFS parent station id (place-*). Joins to dim_stations.
        data_tests:
          - not_null
      - name: stop_id
        data_type: varchar
        description: Platform (GTFS stop id).
      - name: gap_seconds
        data_type: bigint
        description: LAMP's trunk headway for the departure (actual gap), seconds.
        data_tests:
          - not_null
      - name: scheduled_gap_seconds
        data_type: bigint
        description: Scheduled gap, seconds.
      - name: gap_start_at
        data_type: timestamp
        description: 'departed_at - gap_seconds: the previous departure LAMP counted (Boston local).'
      - name: departed_at
        data_type: timestamp
        description: When this train left the platform (LAMP move time at its next stop, Boston local). Null when
          not recorded.
      - name: gap_start_service_date
        data_type: date
        description: Service date of the departure recorded exactly at gap_start_at; null when it is not in the
          files.
      - name: recorded_departures_in_gap
        data_type: bigint
        description: Departures recorded at the same platform strictly inside the gap.
      - name: longest_recorded_piece_seconds
        data_type: bigint
        description: Longest piece of the gap between recorded departures (the gap itself when none is inside).
      - name: recorded_gap_squared_sum
        data_type: double
        description: Sum of the squared pieces between gap_start_at, the recorded departures inside and departed_at
          (gap_seconds^2 when none).
      - name: gap_kind
        data_type: varchar
        description: spans_service_day_boundary, departure_recorded_inside, departure_not_recorded or no_departure_recorded_inside
          (rule in the model header).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - spans_service_day_boundary
                  - departure_recorded_inside
                  - departure_not_recorded
                  - no_departure_recorded_inside
      - name: is_passenger_wait
        data_type: boolean
        description: False only for 'spans_service_day_boundary'.
        data_tests:
          - not_null
  - name: mart_station_rider_time_lost
    description: 'Estimated rider time lost beyond the schedule (an estimate: people entering stations, riders assumed
      to arrive at random). Grain: station, line, service date and service period. Wait without and with the gaps
      over 1 hour; not clamped at 0.'
    config:
      contract:
        enforced: true
    columns:
      - name: station_line_day_period_key
        data_type: varchar
        description: 'Surrogate key: station_id, line_id, date_key, service_period_id.'
        data_tests:
          - unique
          - not_null
      - name: station_id
        data_type: varchar
        description: GTFS parent station id (place-*). Joins to dim_stations.
        data_tests:
          - not_null
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: service_date
        data_type: date
        description: MBTA service date. Trips after midnight belong to the previous date.
        data_tests:
          - not_null
      - name: date_key
        data_type: integer
        description: Date as an integer YYYYMMDD. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: day_type
        data_type: varchar
        description: weekday, saturday, sunday or holiday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - weekday
                  - saturday
                  - sunday
                  - holiday
      - name: service_period_id
        data_type: varchar
        description: MBTA service period. Joins to dim_service_periods.
        data_tests:
          - not_null
      - name: headway_observations
        data_type: bigint
        description: Departures with a headway comparison and a gap of at most wait_max_headway_seconds.
      - name: actual_headway_seconds_sum
        data_type: double
        description: Sum of actual gaps h, seconds. Additive.
      - name: actual_headway_squared_sum
        data_type: double
        description: Sum of h^2 over actual gaps. Additive.
      - name: scheduled_headway_seconds_sum
        data_type: double
        description: Sum of scheduled gaps, seconds. Additive.
      - name: scheduled_headway_squared_sum
        data_type: double
        description: Sum of squared scheduled gaps. Additive.
      - name: suspension_gap_count
        data_type: bigint
        description: Gaps over wait_max_headway_seconds (1 hour). Counted here, not in the ordinary wait sums.
        data_tests:
          - not_null
      - name: suspension_gap_seconds
        data_type: double
        description: Sum of those gaps (actual), seconds.
      - name: suspension_gap_scheduled_seconds
        data_type: double
        description: Sum of the scheduled gaps of those departures, seconds.
      - name: waited_gap_count
        data_type: bigint
        description: Gaps over 1 hour kept as passenger waits (fct_suspension_gaps.is_passenger_wait).
      - name: waited_gap_seconds
        data_type: double
        description: Sum of those gaps, seconds.
      - name: waited_gap_squared_sum
        data_type: double
        description: Sum of recorded_gap_squared_sum over the waited gaps.
      - name: waited_gap_scheduled_seconds
        data_type: double
        description: Sum of scheduled gaps of the waited gaps.
      - name: waited_gap_scheduled_squared_sum
        data_type: double
        description: Sum of squared scheduled gaps of the waited gaps.
      - name: non_wait_gap_count
        data_type: bigint
        description: Gaps over 1 hour that the recorded data shows were not passenger waits (overnight break). Left
          out of wait with gaps.
      - name: non_wait_gap_seconds
        data_type: double
        description: Sum of those gaps, seconds.
      - name: actual_expected_wait_seconds
        data_type: double
        description: 'Expected wait for a rider arriving at random with the actual gaps: sum(h^2) / (2 sum(h)).'
      - name: scheduled_expected_wait_seconds
        data_type: double
        description: Same with the scheduled gaps.
      - name: excess_wait_seconds
        data_type: double
        description: actual_expected_wait_seconds - scheduled_expected_wait_seconds. Signed, not clamped.
      - name: actual_expected_wait_with_gaps_seconds
        data_type: double
        description: Expected wait with the actual gaps, the waited gaps over 1 hour included (their recorded pieces).
      - name: scheduled_expected_wait_with_gaps_seconds
        data_type: double
        description: Same with the scheduled gaps.
      - name: excess_wait_with_gaps_seconds
        data_type: double
        description: actual_expected_wait_with_gaps_seconds - scheduled_expected_wait_with_gaps_seconds. Signed.
      - name: segment_departures
        data_type: bigint
        description: Compared runs over segments starting at this station (runs over 30 minutes included).
      - name: excess_ride_seconds_sum
        data_type: bigint
        description: Sum of net excess run seconds over those runs. Additive.
      - name: excess_ride_seconds
        data_type: double
        description: excess_ride_seconds_sum / segment_departures. Signed, not clamped.
      - name: has_rider_data
        data_type: boolean
        description: True when a gated-entry rider weight exists; rider_* columns are null otherwise.
        data_tests:
          - not_null
      - name: gated_entries
        data_type: double
        description: Average daily gated entries used as the rider weight.
      - name: rider_wait_seconds_lost
        data_type: double
        description: Waiting part of rider_seconds_lost.
      - name: rider_wait_seconds_lost_with_gaps
        data_type: double
        description: Waiting part including the gaps over 1 hour kept as waits (estimate).
      - name: rider_ride_seconds_lost
        data_type: double
        description: In-vehicle part of rider_seconds_lost (first segment after boarding).
      - name: rider_seconds_lost
        data_type: double
        description: Estimated rider-seconds lost beyond the schedule (an estimate, exact, not rounded).
      - name: rider_seconds_lost_with_gaps
        data_type: double
        description: rider_seconds_lost with the gaps over 1 hour kept as waits included in the wait part (estimate).
      - name: share_of_total_rider_time_lost
        data_type: double
        description: rider_seconds_lost / the sum over all cells (wait + ride). Signed, not clamped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_id
              - line_id
              - date_key
              - service_period_id
  - name: mart_rider_time_lost_daily
    description: 'System-wide estimated rider time lost per service date (sum of mart_station_rider_time_lost).
      Grain: one row per service date.'
    config:
      contract:
        enforced: true
    columns:
      - name: service_date
        data_type: date
        description: MBTA service date. Trips after midnight belong to the previous date.
        data_tests:
          - unique
          - not_null
      - name: date_key
        data_type: integer
        description: Date as an integer YYYYMMDD. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: day_type
        data_type: varchar
        description: weekday, saturday, sunday or holiday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - weekday
                  - saturday
                  - sunday
                  - holiday
      - name: is_holiday
        data_type: boolean
        description: True on holidays (seed holidays).
      - name: holiday_name
        data_type: varchar
        description: Holiday name, null on other days.
      - name: week_start_date
        data_type: date
        description: Monday the week starts on.
        data_tests:
          - not_null
      - name: station_cells
        data_type: bigint
        description: Station x line x period cells with trains that day.
      - name: station_cells_with_riders
        data_type: bigint
        description: Cells with a rider weight.
      - name: has_rider_data
        data_type: boolean
        description: At least one cell has a rider weight. False on a holiday when the rider basis has no holiday.
        data_tests:
          - not_null
      - name: gated_entries
        data_type: double
        description: Average daily gated entries used as the rider weight.
      - name: rider_wait_seconds_lost
        data_type: double
        description: Waiting part of rider_seconds_lost.
      - name: rider_ride_seconds_lost
        data_type: double
        description: In-vehicle part of rider_seconds_lost (first segment after boarding).
      - name: rider_seconds_lost
        data_type: double
        description: Estimated rider-seconds lost beyond the schedule (an estimate, exact, not rounded).
      - name: seconds_lost_per_entry
        data_type: double
        description: rider_seconds_lost / gated_entries.
      - name: rider_wait_seconds_lost_with_gaps
        data_type: double
        description: Waiting part including the gaps over 1 hour kept as waits (estimate).
      - name: rider_seconds_lost_with_gaps
        data_type: double
        description: rider_seconds_lost with the gaps over 1 hour kept as waits included in the wait part (estimate).
      - name: seconds_lost_per_entry_with_gaps
        data_type: double
        description: rider_seconds_lost_with_gaps / gated_entries.
      - name: suspension_gap_count
        data_type: bigint
        description: Gaps over wait_max_headway_seconds (1 hour). Counted here, not in the ordinary wait sums.
        data_tests:
          - not_null
      - name: suspension_gap_seconds
        data_type: double
        description: Sum of those gaps (actual), seconds.
      - name: waited_gap_count
        data_type: bigint
        description: Gaps over 1 hour kept as passenger waits (fct_suspension_gaps.is_passenger_wait).
      - name: waited_gap_seconds
        data_type: double
        description: Sum of those gaps, seconds.
      - name: non_wait_gap_count
        data_type: bigint
        description: Gaps over 1 hour that the recorded data shows were not passenger waits (overnight break). Left
          out of wait with gaps.
      - name: non_wait_gap_seconds
        data_type: double
        description: Sum of those gaps, seconds.
      - name: cells_no_trains
        data_type: bigint
        description: 'Station, line and service-period cells of the date''s day type with a rider weight but no recorded train that date.'
        data_tests:
          - not_null
      - name: gated_entries_no_trains
        data_type: double
        description: 'Average daily gated entries of those cells (the rider weight with no train to weight). Null when the date has no rider weight.'
      - name: gated_entries_all_cells
        data_type: double
        description: 'gated_entries + gated_entries_no_trains: all gated entries for the day type (sum of int_station_period_riders).'
  - name: mart_rider_time_lost_weekly
    description: 'Weekly trend of estimated rider time lost. Grain: one row per week starting Monday.'
    config:
      contract:
        enforced: true
    columns:
      - name: week_start_date
        data_type: date
        description: Monday the week starts on.
        data_tests:
          - unique
          - not_null
      - name: week_end_date
        data_type: date
        description: Sunday the week ends on.
      - name: first_service_date
        data_type: date
        description: First loaded date in the week.
      - name: last_service_date
        data_type: date
        description: Last loaded date in the week.
      - name: service_dates
        data_type: integer
        description: Loaded dates in the week.
      - name: dates_with_rider_data
        data_type: integer
        description: Dates with a rider weight.
      - name: weekdays_with_rider_data
        data_type: integer
        description: Weekdays with a rider weight.
      - name: is_complete_week
        data_type: boolean
        description: All 7 dates loaded.
      - name: rider_seconds_lost
        data_type: double
        description: Estimated rider-seconds lost beyond the schedule (an estimate, exact, not rounded).
      - name: rider_wait_seconds_lost
        data_type: double
        description: Waiting part of rider_seconds_lost.
      - name: rider_ride_seconds_lost
        data_type: double
        description: In-vehicle part of rider_seconds_lost (first segment after boarding).
      - name: avg_daily_rider_seconds_lost
        data_type: double
        description: Average rider-seconds lost per date with a rider weight.
      - name: avg_weekday_rider_seconds_lost
        data_type: double
        description: Average rider-seconds lost per weekday with a rider weight.
      - name: seconds_lost_per_entry
        data_type: double
        description: rider_seconds_lost / gated_entries.
      - name: rider_seconds_lost_with_gaps
        data_type: double
        description: rider_seconds_lost with the gaps over 1 hour kept as waits included in the wait part (estimate).
      - name: avg_daily_rider_seconds_lost_with_gaps
        data_type: double
        description: Average rider-seconds lost with gaps per date with a rider weight.
      - name: avg_weekday_rider_seconds_lost_with_gaps
        data_type: double
        description: Same per weekday.
      - name: suspension_gap_count
        data_type: bigint
        description: Gaps over wait_max_headway_seconds (1 hour). Counted here, not in the ordinary wait sums.
        data_tests:
          - not_null
      - name: suspension_gap_seconds
        data_type: double
        description: Sum of those gaps (actual), seconds.
      - name: non_wait_gap_count
        data_type: bigint
        description: Gaps over 1 hour that the recorded data shows were not passenger waits (overnight break). Left
          out of wait with gaps.
      - name: non_wait_gap_seconds
        data_type: double
        description: Sum of those gaps, seconds.
  - name: mart_train_delay_daily
    description: 'Measured train delay per service date: recorded run time over schedule summed over every run in
      int_train_runs, positive and net, with runs over 30 minutes and not-compared runs counted on their own. Grain:
      one row per service date.'
    config:
      contract:
        enforced: true
    columns:
      - name: service_date
        data_type: date
        description: MBTA service date. Trips after midnight belong to the previous date.
        data_tests:
          - unique
          - not_null
      - name: date_key
        data_type: integer
        description: Date as an integer YYYYMMDD. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: day_type
        data_type: varchar
        description: weekday, saturday, sunday or holiday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - weekday
                  - saturday
                  - sunday
                  - holiday
      - name: is_holiday
        data_type: boolean
        description: True on holidays (seed holidays).
      - name: runs_observed
        data_type: bigint
        description: All runs after a trip's first observed stop. = runs_compared + the four not-compared counts.
        data_tests:
          - not_null
      - name: runs_compared
        data_type: bigint
        description: Runs with actual and scheduled run time both positive.
      - name: trips_compared
        data_type: bigint
        description: Trips with at least one compared run.
      - name: actual_run_seconds_sum
        data_type: bigint
        description: Sum of actual_run_seconds over compared runs (as recorded, including any terminal hold inside
          it).
      - name: scheduled_run_seconds_sum
        data_type: bigint
        description: Sum of scheduled run seconds over compared runs.
      - name: terminal_hold_in_actual_seconds_sum
        data_type: bigint
        description: Terminal hold that was inside actual_run_seconds and was split out of the run (compared runs).
      - name: positive_excess_seconds
        data_type: bigint
        description: Sum of max(run - scheduled, 0) over compared runs.
      - name: net_excess_seconds
        data_type: bigint
        description: Sum of (run - scheduled) over compared runs = actual_run_seconds_sum - terminal_hold_in_actual_seconds_sum
          - scheduled_run_seconds_sum.
      - name: positive_excess_seconds_per_run
        data_type: double
        description: positive_excess_seconds / runs_compared.
      - name: net_excess_seconds_per_run
        data_type: double
        description: net_excess_seconds / runs_compared.
      - name: long_runs
        data_type: bigint
        description: Compared runs whose run time is over travel_outlier_seconds (30 min). Included in every sum.
      - name: long_run_seconds
        data_type: bigint
        description: Run time of the runs over 30 minutes.
      - name: long_run_positive_excess_seconds
        data_type: bigint
        description: Positive excess of the runs over 30 minutes (part of positive_excess_seconds).
      - name: long_run_net_excess_seconds
        data_type: bigint
        description: Net excess of the runs over 30 minutes (part of net_excess_seconds).
      - name: terminal_departure_runs
        data_type: bigint
        description: Runs leaving a branch terminal.
      - name: terminal_hold_runs
        data_type: bigint
        description: Terminal departures with a recorded hold.
      - name: terminal_hold_seconds_sum
        data_type: bigint
        description: Recorded time on terminal platforms before departure. Not part of the delay.
      - name: terminal_hold_negative_runs
        data_type: bigint
        description: 'Terminal holds where LAMP records the departure before the arrival (a timestamp problem). Kept as recorded.'
        data_tests:
          - not_null
      - name: terminal_hold_negative_seconds_sum
        data_type: bigint
        description: 'Sum of the negative terminal holds (zero or below): holds where LAMP records the departure before the arrival. Already inside terminal_hold_seconds_sum; shown on its own.'
        data_tests:
          - not_null
      - name: terminal_hold_positive_seconds_sum
        data_type: bigint
        description: 'Sum of the positive terminal holds. terminal_hold_seconds_sum = terminal_hold_positive_seconds_sum + terminal_hold_negative_seconds_sum.'
        data_tests:
          - not_null
      - name: runs_actual_missing
        data_type: bigint
        description: Runs without an actual run time (a timestamp missing).
      - name: runs_scheduled_missing
        data_type: bigint
        description: Runs without a scheduled run time.
      - name: runs_actual_not_positive
        data_type: bigint
        description: Runs whose recorded arrival is at or before the previous arrival (a LAMP timestamp problem).
      - name: actual_not_positive_net_seconds
        data_type: bigint
        description: Sum of actual - scheduled over those runs (not part of the delay).
      - name: runs_scheduled_not_positive
        data_type: bigint
        description: Runs whose scheduled run time is zero or negative.
      - name: scheduled_not_positive_net_seconds
        data_type: bigint
        description: Sum of actual - scheduled over those runs (not part of the delay).
  - name: mart_train_delay_summary
