      - name: avg_daily_long_run_positive_excess_seconds
        data_type: double
        description: Positive excess of runs over 30 minutes per day.
      - name: avg_daily_long_run_net_excess_seconds
        data_type: double
        description: Net excess of runs over 30 minutes per day.
      - name: avg_daily_positive_excess_seconds_excl_long_runs
        data_type: double
        description: Positive excess per day without the runs over 30 minutes.
      - name: avg_daily_net_excess_seconds_excl_long_runs
        data_type: double
        description: Net excess per day without the runs over 30 minutes.
      - name: terminal_hold_in_actual_seconds_sum
        data_type: bigint
        description: Terminal hold that was inside actual_run_seconds and was split out of the run (compared runs).
      - name: terminal_departure_runs
        data_type: bigint
        description: Runs leaving a branch terminal.
      - name: terminal_hold_runs
        data_type: bigint
        description: Terminal departures with a recorded hold.
      - name: terminal_hold_seconds_sum
        data_type: bigint
        description: Recorded time on terminal platforms before departure, total. Not part of the delay.
      - name: avg_daily_terminal_hold_seconds
        data_type: double
