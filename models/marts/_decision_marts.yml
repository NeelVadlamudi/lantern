      - name: terminal_hold_negative_seconds_sum
        data_type: bigint
        description: 'Sum of the negative terminal holds (zero or below): holds where LAMP records the departure before the arrival. Already inside terminal_hold_seconds_sum; shown on its own.'
        data_tests:
          - not_null
      - name: terminal_hold_positive_seconds_sum
        data_type: bigint
        description: 'Sum of the positive terminal holds. terminal_hold_seconds_sum = terminal_hold_positive_seconds_sum + terminal_hold_negative_seconds_sum.'
        data_tests:
          - not_null
      - name: avg_daily_terminal_hold_negative_seconds
        data_type: double
        description: 'terminal_hold_negative_seconds_sum / service_dates.'
      - name: avg_daily_terminal_hold_positive_seconds
        data_type: double
        description: 'terminal_hold_positive_seconds_sum / service_dates.'
      - name: runs_actual_missing
        data_type: bigint
        description: Runs without an actual run time (a timestamp missing).
      - name: runs_scheduled_missing
