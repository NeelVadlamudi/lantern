  - name: mart_segment_reliability
    description: 'Per segment over the loaded window: measured train delay (positive and net), rank by weekday train
      delay, terminal holds, buffer time, schedule-or-service class. Grain: one row per segment.'
    config:
      contract:
        enforced: true
    columns:
      - name: segment_id
        data_type: varchar
        description: 'Surrogate key: line_id, direction_id, from_station_id, to_station_id. Joins to dim_segments.'
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segments')
                field: segment_id
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: direction_id
        data_type: integer
        description: 'GTFS direction: 0 or 1.'
        data_tests:
          - not_null
      - name: from_station_id
        data_type: varchar
        description: Station the segment starts at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: from_station_name
        data_type: varchar
        description: Name of the start station.
      - name: to_station_id
        data_type: varchar
        description: Station the segment ends at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: to_station_name
        data_type: varchar
        description: Name of the end station.
      - name: segment_name
        data_type: varchar
        description: '''<start station> to <end station>''.'
        data_tests:
          - not_null
      - name: is_terminal_departure
        data_type: boolean
        description: 'True when the start station is the first stop of the canonical pattern of the branch (for
          a segment: of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: is_terminal_arrival
        data_type: boolean
        description: 'True when the end station is the last stop of the canonical pattern of the branch (for a segment:
          of at least one branch that runs over it).'
        data_tests:
          - not_null
      - name: runs_observed
        data_type: bigint
        description: All observed runs, compared to the schedule or not.
        data_tests:
          - not_null
      - name: traversals
        data_type: bigint
        description: Compared runs over the segment (runs over 30 minutes included).
        data_tests:
          - not_null
      - name: runs_not_compared
        data_type: bigint
        description: Observed runs without both actual and scheduled run time positive (counted, not summed).
      - name: service_dates_observed
        data_type: integer
        description: Dates with at least one compared run.
      - name: positive_excess_seconds_sum
        data_type: bigint
        description: Sum of max(run - scheduled, 0) over compared runs. Additive.
      - name: net_excess_seconds_sum
        data_type: bigint
        description: Sum of (run - scheduled) over compared runs. Additive, signed.
      - name: avg_positive_excess_seconds
        data_type: double
        description: positive_excess_seconds_sum / compared runs.
      - name: avg_net_excess_seconds
        data_type: double
        description: net_excess_seconds_sum / compared runs.
      - name: weekday_runs
        data_type: bigint
        description: Compared runs on weekdays.
      - name: avg_weekday_runs
        data_type: double
        description: weekday_runs / weekdays loaded.
      - name: avg_weekday_positive_excess_seconds
        data_type: double
        description: 'Positive excess summed over weekday runs / weekdays loaded: train delay per average weekday.
          The rank basis.'
      - name: avg_weekday_net_excess_seconds
        data_type: double
        description: Net excess summed over weekday runs / weekdays loaded.
      - name: avg_daily_positive_excess_seconds
        data_type: double
        description: Positive excess / all service dates loaded.
      - name: avg_daily_net_excess_seconds
        data_type: double
        description: Net excess / all service dates loaded.
      - name: long_runs
        data_type: bigint
        description: Compared runs whose run time is over travel_outlier_seconds (30 min). Included in every sum.
      - name: long_run_positive_excess_seconds_sum
        data_type: bigint
        description: Positive excess of the runs over 30 minutes (part of positive_excess_seconds_sum).
      - name: long_run_net_excess_seconds_sum
        data_type: bigint
        description: Net excess of the runs over 30 minutes (part of net_excess_seconds_sum).
      - name: avg_weekday_long_run_positive_excess_seconds
        data_type: double
        description: Positive excess of the runs over 30 minutes per average weekday (part of avg_weekday_positive_excess_seconds).
      - name: terminal_time_split
        data_type: varchar
        description: '''departure_hold_split'' (terminal hold split out from recorded times), ''departure_hold_not_recorded''
          (a timestamp is missing), ''arrival_not_split'' (LAMP has no timestamp for holding outside a terminal,
          so it stays in the run) or ''not_terminal''.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - departure_hold_split
                  - departure_hold_not_recorded
                  - arrival_not_split
                  - not_terminal
      - name: terminal_hold_runs
        data_type: bigint
        description: Terminal departures with a recorded hold.
      - name: terminal_hold_seconds_sum
        data_type: bigint
        description: Recorded time on the terminal platform before departure, summed. Not part of the excess.
      - name: terminal_hold_negative_runs
        data_type: bigint
        description: Terminal holds where LAMP records the departure before the arrival (a timestamp problem). Kept
          as recorded.
      - name: terminal_hold_negative_seconds_sum
        data_type: bigint
        description: 'Sum of the negative terminal holds (zero or below): holds where LAMP records the departure before the arrival. Already inside terminal_hold_seconds_sum; shown on its own. All days.'
        data_tests:
          - not_null
      - name: weekday_terminal_hold_negative_runs
        data_type: bigint
        description: 'Negative terminal holds on weekdays.'
        data_tests:
          - not_null
      - name: avg_weekday_terminal_hold_negative_seconds
        data_type: double
        description: 'Negative part of avg_weekday_terminal_hold_seconds: weekday sum of negative holds / weekdays in the window. Null where the segment has no recorded holds.'
      - name: terminal_hold_in_actual_seconds_sum
        data_type: bigint
        description: Terminal hold that was inside actual_run_seconds and was split out of the run (compared runs).
      - name: avg_terminal_hold_seconds
        data_type: double
        description: terminal_hold_seconds_sum / terminal_hold_runs.
      - name: avg_weekday_terminal_hold_seconds
        data_type: double
        description: Weekday terminal hold seconds / weekdays loaded.
      - name: median_scheduled_run_seconds
        data_type: double
        description: Median scheduled run time of compared runs, seconds.
      - name: median_run_seconds
        data_type: double
        description: Median actual run time of compared runs, seconds.
      - name: p90_run_seconds
        data_type: double
        description: 90th percentile actual run time of compared runs, seconds.
      - name: buffer_seconds
        data_type: double
        description: p90_run_seconds - median_run_seconds.
      - name: buffer_index
        data_type: double
        description: buffer_seconds / median_run_seconds.
      - name: loss_rank
        data_type: integer
        description: Rank by avg_weekday_positive_excess_seconds (weekday train delay), highest first, among segments
          with weekday runs (ties by segment_id). Riders are not used.
      - name: is_top_10
        data_type: boolean
        description: loss_rank <= 10.
        data_tests:
          - not_null
      - name: share_of_segment_train_delay
        data_type: double
        description: avg_weekday_positive_excess_seconds / the sum over all segments.
      - name: start_station_has_gate_data
        data_type: boolean
        description: True when the start station has fare-gate entry data for the line.
      - name: start_station_avg_weekday_entries
        data_type: double
        description: People entering the start station on this line through fare gates on an average weekday (all
          periods). Entries at the station, not riders on the segment. Not used in the rank.
      - name: cause_days
        data_type: integer
        description: Dates with at least cause_min_runs_per_day compared runs.
      - name: bias_seconds
        data_type: double
        description: Median of the daily average net excess over cause_days (bias).
      - name: daily_excess_p25_seconds
        data_type: double
        description: 25th percentile of the daily average net excess.
      - name: daily_excess_p75_seconds
        data_type: double
        description: 75th percentile of the daily average net excess.
      - name: variability_iqr_seconds
        data_type: double
        description: p75 - p25 of the daily average net excess (variability).
      - name: cause_class
        data_type: varchar
        description: schedule, service, mixed or insufficient_data (rule in the model header).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - schedule
                  - service
                  - mixed
                  - insufficient_data
  - name: mart_line_buffer
    description: 'Buffer time per line, runs-weighted over its segments. Grain: one row per line.'
    config:
      contract:
        enforced: true
    columns:
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - unique
          - not_null
      - name: segments
        data_type: integer
        description: Segments with compared runs.
      - name: traversals
        data_type: bigint
        description: Compared runs over those segments.
        data_tests:
          - not_null
      - name: avg_segment_median_run_seconds
        data_type: double
        description: Runs-weighted average of segment median run time.
      - name: avg_segment_p90_run_seconds
        data_type: double
        description: Runs-weighted average of segment p90 run time.
      - name: avg_segment_buffer_seconds
        data_type: double
        description: Runs-weighted average segment buffer (p90 - median).
      - name: buffer_index
        data_type: double
        description: sum(runs x buffer) / sum(runs x median run time).
      - name: max_segment_buffer_seconds
        data_type: double
        description: Largest segment buffer on the line.
      - name: max_buffer_segment_name
        data_type: varchar
        description: Segment with the largest buffer.
  - name: mart_segment_trend
    description: 'Getting worse per segment: last worse_recent_days dates vs the worse_prior_days before them, with
      every raw value behind the flag. Grain: one row per segment.'
    config:
      contract:
        enforced: true
    columns:
      - name: segment_id
        data_type: varchar
        description: 'Surrogate key: line_id, direction_id, from_station_id, to_station_id. Joins to dim_segments.'
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segments')
                field: segment_id
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: direction_id
        data_type: integer
        description: 'GTFS direction: 0 or 1.'
        data_tests:
          - not_null
      - name: from_station_id
        data_type: varchar
        description: Station the segment starts at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: to_station_id
        data_type: varchar
        description: Station the segment ends at (GTFS parent station, place-*).
        data_tests:
          - not_null
      - name: segment_name
        data_type: varchar
        description: '''<start station> to <end station>''.'
        data_tests:
          - not_null
      - name: prior_start_date
        data_type: date
        description: First date of the prior window.
      - name: prior_end_date
        data_type: date
        description: Last date of the prior window (the day before the recent window).
      - name: recent_start_date
        data_type: date
        description: First date of the recent window.
      - name: recent_end_date
        data_type: date
        description: Last date of the recent window (latest loaded service date).
      - name: recent_dates
        data_type: integer
        description: Service dates in the recent window.
      - name: prior_dates
        data_type: integer
        description: Service dates in the prior window.
      - name: runs_recent
        data_type: bigint
        description: Compared runs in the recent window.
      - name: runs_prior
        data_type: bigint
        description: Compared runs in the prior window.
      - name: positive_excess_seconds_sum_recent
        data_type: bigint
        description: Positive excess summed over compared runs, recent window.
      - name: positive_excess_seconds_sum_prior
        data_type: bigint
        description: Same, prior window.
      - name: net_excess_seconds_sum_recent
        data_type: bigint
        description: Net excess summed over compared runs, recent window.
      - name: net_excess_seconds_sum_prior
        data_type: bigint
        description: Same, prior window.
      - name: avg_excess_seconds_recent
        data_type: double
        description: Net excess per run, recent window.
      - name: avg_excess_seconds_prior
        data_type: double
        description: Net excess per run, prior window.
      - name: delta_excess_seconds
        data_type: double
        description: avg_excess_seconds_recent - avg_excess_seconds_prior.
      - name: avg_positive_excess_seconds_recent
        data_type: double
        description: Positive excess per run, recent window.
      - name: avg_positive_excess_seconds_prior
        data_type: double
        description: Positive excess per run, prior window.
      - name: delta_positive_excess_seconds
        data_type: double
        description: avg_positive_excess_seconds_recent - avg_positive_excess_seconds_prior.
      - name: avg_daily_positive_excess_seconds_recent
        data_type: double
        description: Positive excess per service date of the recent window (train delay per day).
      - name: avg_daily_positive_excess_seconds_prior
        data_type: double
        description: Same, prior window.
      - name: delta_daily_positive_excess_seconds
        data_type: double
        description: Recent minus prior train delay per day.
      - name: delay_share_recent
        data_type: double
        description: avg_daily_positive_excess_seconds_recent / the sum over all segments.
      - name: delay_share_prior
        data_type: double
        description: Same, prior window.
      - name: delay_share_change
        data_type: double
        description: delay_share_recent - delay_share_prior.
      - name: meets_volume_threshold
        data_type: boolean
        description: Cleared both minimum-volume thresholds (worse_min_volume_recent, worse_min_volume_prior).
        data_tests:
          - not_null
      - name: typical_delta_excess_seconds
        data_type: double
        description: Median delta_excess_seconds over the rows that clear the volume threshold.
      - name: delta_above_typical_seconds
        data_type: double
        description: delta_excess_seconds - typical_delta_excess_seconds.
      - name: is_getting_worse
        data_type: boolean
        description: Volume threshold cleared and delta_excess_seconds >= worse_min_delta_seconds and >= typical
          delta + worse_min_delta_seconds.
        data_tests:
          - not_null
  - name: mart_station_trend
    description: 'Getting worse per station and line: last worse_recent_days dates vs the worse_prior_days before
      them. Grain: one row per station and line.'
    config:
      contract:
        enforced: true
    columns:
      - name: station_line_key
        data_type: varchar
        description: 'Surrogate key: station_id, line_id.'
        data_tests:
          - unique
          - not_null
      - name: station_id
        data_type: varchar
        description: GTFS parent station id (place-*). Joins to dim_stations.
        data_tests:
          - not_null
      - name: station_name
        data_type: varchar
        description: Station name.
      - name: line_id
        data_type: varchar
        description: 'Trunk line: Red, Mattapan, Orange, Green or Blue (Green branches share one line).'
        data_tests:
          - not_null
      - name: prior_start_date
        data_type: date
        description: First date of the prior window.
      - name: prior_end_date
        data_type: date
        description: Last date of the prior window (the day before the recent window).
      - name: recent_start_date
        data_type: date
        description: First date of the recent window.
      - name: recent_end_date
        data_type: date
        description: Last date of the recent window (latest loaded service date).
      - name: departures_recent
        data_type: bigint
        description: Departures with a headway comparison, recent window.
      - name: departures_prior
        data_type: bigint
        description: Same, prior window.
      - name: segment_departures_recent
        data_type: bigint
        description: Compared runs over segments starting here, recent window.
      - name: segment_departures_prior
        data_type: bigint
        description: Same, prior window.
      - name: suspension_gap_count_recent
        data_type: bigint
        description: Gaps over 1 hour, recent window.
      - name: suspension_gap_count_prior
        data_type: bigint
        description: Same, prior window.
      - name: suspension_gap_seconds_recent
        data_type: double
        description: Seconds of those gaps, recent window.
      - name: suspension_gap_seconds_prior
        data_type: double
        description: Same, prior window.
      - name: excess_wait_seconds_recent
        data_type: double
        description: Excess wait per rider (gaps of 1 hour or less), recent window.
      - name: excess_wait_seconds_prior
        data_type: double
        description: Same, prior window.
      - name: delta_excess_wait_seconds
        data_type: double
        description: excess_wait_seconds_recent - excess_wait_seconds_prior.
      - name: excess_ride_seconds_recent
        data_type: double
        description: Excess ride per rider, recent window.
      - name: excess_ride_seconds_prior
        data_type: double
        description: Same, prior window.
      - name: delta_excess_ride_seconds
        data_type: double
        description: excess_ride_seconds_recent - excess_ride_seconds_prior.
      - name: excess_wait_with_gaps_seconds_recent
        data_type: double
        description: Excess wait per rider with the gaps over 1 hour kept as waits, recent window.
      - name: excess_wait_with_gaps_seconds_prior
        data_type: double
        description: Same, prior window.
      - name: excess_seconds_per_rider_with_gaps_recent
        data_type: double
        description: Excess wait with gaps + excess ride, recent window.
      - name: excess_seconds_per_rider_with_gaps_prior
        data_type: double
        description: Same, prior window.
      - name: delta_excess_with_gaps_seconds
        data_type: double
        description: Recent minus prior, with gaps.
      - name: excess_seconds_per_rider_recent
        data_type: double
        description: Excess wait + excess ride per rider, pooled over the recent window.
      - name: excess_seconds_per_rider_prior
        data_type: double
        description: Same, prior window.
      - name: delta_excess_seconds
        data_type: double
        description: excess_seconds_per_rider_recent - excess_seconds_per_rider_prior.
      - name: avg_daily_rider_seconds_lost_recent
        data_type: double
        description: Average daily rider-seconds lost, recent window.
      - name: avg_daily_rider_seconds_lost_prior
        data_type: double
        description: Average daily rider-seconds lost, prior window.
      - name: delta_daily_rider_seconds_lost
        data_type: double
        description: Average daily rider-seconds lost, recent minus prior.
      - name: avg_daily_rider_seconds_lost_with_gaps_recent
        data_type: double
        description: Average daily rider-seconds lost with gaps, recent window.
      - name: avg_daily_rider_seconds_lost_with_gaps_prior
        data_type: double
        description: Same, prior window.
      - name: loss_share_recent
        data_type: double
        description: The row's average daily rider time lost over the sum of all rows in the recent window. Signed, not clamped; the shares sum to 1.
      - name: loss_share_prior
        data_type: double
        description: Same share in the prior window.
      - name: loss_share_change
        data_type: double
        description: loss_share_recent - loss_share_prior.
      - name: meets_volume_threshold
        data_type: boolean
        description: Cleared both minimum-volume thresholds (worse_min_volume_recent, worse_min_volume_prior).
        data_tests:
          - not_null
      - name: typical_delta_excess_seconds
        data_type: double
        description: Median delta_excess_seconds over the rows that clear the volume threshold.
      - name: delta_above_typical_seconds
        data_type: double
        description: delta_excess_seconds - typical_delta_excess_seconds.
      - name: is_getting_worse
        data_type: boolean
        description: Volume threshold cleared and delta_excess_seconds >= worse_min_delta_seconds and >= typical
          delta + worse_min_delta_seconds.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_id
              - line_id

  - name: mart_segment_concentration
    description: 'Terminal hold distribution and the worst window of consecutive days per track segment. Grain: one row
      per segment with compared runs. Shares are the window''s train delay (positive excess) and compared runs over the
      segment''s totals for the loaded window.'
    config:
      contract:
        enforced: true
    columns:
      - name: segment_id
        data_type: varchar
        description: Joins to dim_segments.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segments')
                field: segment_id
      - name: traversals
        data_type: bigint
        description: Compared runs over the loaded window (mart_segment_daily.traversals summed).
        data_tests:
          - not_null
      - name: positive_excess_seconds_sum
        data_type: bigint
        description: Train delay (positive excess) summed over the loaded window, seconds.
        data_tests:
          - not_null
      - name: terminal_hold_runs
        data_type: bigint
        description: Runs with a recorded terminal hold (0 when the segment does not start at a terminal).
        data_tests:
          - not_null
      - name: terminal_hold_median_seconds
        data_type: double
        description: Median recorded terminal hold per run, seconds (quantile_cont; negative holds included as recorded).
      - name: terminal_hold_p90_seconds
        data_type: double
        description: 90th percentile recorded terminal hold per run, seconds (quantile_cont).
      - name: terminal_hold_mean_seconds
        data_type: double
        description: Mean recorded terminal hold per run, seconds. Equals mart_segment_reliability.avg_terminal_hold_seconds.
      - name: worst_window_days
        data_type: integer
        description: Length of the window in calendar days (var worst_window_days).
      - name: worst_window_start_date
        data_type: date
        description: First day of the window with the largest share of the segment's train delay (ties - earliest).
      - name: worst_window_end_date
        data_type: date
        description: Last day of that window (start + worst_window_days - 1).
      - name: worst_window_positive_excess_seconds_sum
        data_type: bigint
        description: Train delay in the worst window, seconds.
      - name: worst_window_traversals
        data_type: bigint
        description: Compared runs in the worst window.
      - name: worst_window_share_of_delay
        data_type: double
        description: worst_window_positive_excess_seconds_sum / positive_excess_seconds_sum.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: worst_window_share_of_runs
        data_type: double
        description: worst_window_traversals / traversals.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
