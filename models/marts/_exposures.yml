version: 2

exposures:
  - name: reliability_board
    label: Subway reliability board
    type: application
    maturity: medium
    url: ./index.html
    description: >
      Interactive board served from GitHub Pages. It queries the Parquet files in out/ with
      DuckDB in the browser, reads out/board_data.json (written from board_payload by the on-run-end hook) for tiles, glossary and build stats, tests its duration labels against
      out/duration_label_cases.json (from board_duration_label_cases), and
      overlays live vehicle positions from the MBTA V3 API (outside dbt).
    depends_on:
      - ref('board_line_daily')
      - ref('board_line_periods')
      - ref('board_station_periods')
      - ref('board_station_daily')
      - ref('board_map_stations')
      - ref('board_line_stops')
      - ref('board_line_shapes')
      - ref('board_service_periods')
      - ref('board_routes')
      - ref('board_segments')
      - ref('board_rider_time_lost_daily')
      - ref('board_rider_time_lost_weekly')
      - ref('board_station_time_lost')
      - ref('board_station_trend')
      - ref('board_line_buffer')
      - ref('board_duration_label_cases')
      - ref('board_train_delay_daily')
      - ref('board_suspension_gaps')
      - ref('board_line_day_metrics')
      - ref('board_day_worst_segments')
      - ref('board_day_worst_stations')
      - ref('board_line_hour_heatmap')
      - ref('board_station_hour_heatmap')
      - ref('board_delay_histogram')
      - ref('board_train_delay_by_line')
      - ref('board_cr_daily')
      - ref('board_cr_monthly')
      - ref('board_survey_lines')
      - ref('board_freedom_trail')
      - ref('board_freedom_trail_json')
      - ref('board_payload')
    owner:
      name: Neel Vadlamudi
